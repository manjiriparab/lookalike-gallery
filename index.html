<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lookalikes — The Gallery</title>
<style>
  :root{
    --bg: #0B0E17;
    --bg-soft: #12172a;
    --gold: #D4AF37;
    --cream: #F5F0E6;
    --accent: #E0457B;
    --line: rgba(245,240,230,0.12);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(212,175,55,0.10), transparent 45%),
      radial-gradient(ellipse at 90% 10%, rgba(224,69,123,0.08), transparent 40%),
      var(--bg);
    color: var(--cream);
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
  }

  header{
    padding: 70px 24px 30px;
    text-align: center;
  }

  .bulbs{
    display:flex;
    justify-content:center;
    gap: 10px;
    margin-bottom: 26px;
  }
  .bulb{
    width:7px; height:7px; border-radius:50%;
    background: var(--gold);
    box-shadow: 0 0 8px 2px rgba(212,175,55,0.7);
    animation: flicker 1.6s infinite ease-in-out;
  }
  .bulb:nth-child(odd){animation-delay: .2s;}
  .bulb:nth-child(3n){animation-delay: .5s;}
  @keyframes flicker{
    0%, 100%{opacity:1;}
    50%{opacity:.25;}
  }
  @media (prefers-reduced-motion: reduce){
    .bulb{animation:none;}
  }

  h1{
    margin:0;
    font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
    letter-spacing: 0.08em;
    font-size: clamp(2.6rem, 7vw, 5.2rem);
    text-transform: uppercase;
    color: var(--cream);
    text-shadow: 0 0 30px rgba(212,175,55,0.25);
  }
  h1 span{ color: var(--gold); }

  .tagline{
    margin-top: 14px;
    font-style: italic;
    color: rgba(245,240,230,0.55);
    font-size: 1.05rem;
  }

  .search-wrap{
    max-width: 480px;
    margin: 38px auto 0;
    padding: 0 24px;
    position: relative;
  }
  #search{
    width: 100%;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 30px;
    padding: 14px 22px;
    font-family: 'Georgia', serif;
    font-size: 1rem;
    color: var(--cream);
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  #search::placeholder{ color: rgba(245,240,230,0.4); font-style: italic; }
  #search:focus{
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212,175,55,0.15);
  }

  main{
    max-width: 1100px;
    margin: 0 auto;
    padding: 50px 24px 100px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .group{
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 26px;
  }

  .tiles{
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
    justify-content: center;
  }

  .tile{
    flex: 1 1 170px;
    max-width: 210px;
    text-align: center;
  }

  .tile-photo{
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'Arial Black', sans-serif;
    font-size: 2.2rem;
    color: rgba(255,255,255,0.9);
    overflow: hidden;
    border: 1px solid var(--line);
  }

  .tile-name{
    margin-top: 12px;
    font-size: 1rem;
    color: var(--cream);
  }

  .tile-bio{
    margin-top: 3px;
    font-size: 0.82rem;
    font-style: italic;
    color: rgba(245,240,230,0.5);
    line-height: 1.4;
  }

  .connector{
    text-align:center;
    font-family: sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 18px;
    opacity: 0.75;
  }

  .empty{
    text-align: center;
    padding: 60px 20px;
    color: rgba(245,240,230,0.5);
    font-style: italic;
  }

  footer{
    text-align:center;
    padding: 30px 20px 50px;
    font-family: sans-serif;
    font-size: 0.75rem;
    color: rgba(245,240,230,0.35);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<header>
  <div class="bulbs">
    <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
    <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
    <div class="bulb"></div>
  </div>
  <h1>LOOK<span>ALIKES</span></h1>
  <p class="tagline">A gallery of uncanny resemblances</p>

  <div class="search-wrap">
    <input id="search" type="text" placeholder="Search by name…" />
  </div>
</header>

<main id="grid"></main>

<footer>CURATED WITH CARE · REPLACE PLACEHOLDER ENTRIES WITH YOUR OWN PHOTOS BELOW</footer>

<script>
/* ============================================================
   ENTRIES NOW LIVE IN data.json (same folder as this file).
   To add or edit lookalikes, open data.json — no code changes needed.
   Each "group" is one lookalike match: the real person plus every
   celebrity they resemble. All tiles in a group are equal footing —
   there is no primary/secondary photo.

   NOTE: fetch() only works when this page is served over http(s),
   e.g. via GitHub Pages. Opening the .html file directly by
   double-clicking it (file://) will NOT load the data.
   ============================================================ */
let groups = [];

const gradients = [
  "linear-gradient(135deg,#3a2a55,#6b4c6b)",
  "linear-gradient(135deg,#1f3a5f,#3f6b9f)",
  "linear-gradient(135deg,#5f2a3a,#9f3f5f)",
  "linear-gradient(135deg,#2a5f4a,#3f9f7f)",
  "linear-gradient(135deg,#5f4a2a,#9f7f3f)",
  "linear-gradient(135deg,#3a3a5f,#6b6b9f)",
];

function initials(name){
  return name.split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
}

function tileHTML(person, colorIndex){
  const bg = person.photo
    ? `center/cover no-repeat url('${person.photo}')`
    : gradients[colorIndex % gradients.length];
  const label = person.photo ? "" : initials(person.name);
  return `
    <div class="tile">
      <div class="tile-photo" style="background:${bg}">${label}</div>
      <div class="tile-name">${person.name}</div>
      <div class="tile-bio">${person.bio}</div>
    </div>
  `;
}

function render(query){
  const grid = document.getElementById("grid");
  const q = query.trim().toLowerCase();

  const filtered = groups.filter(g =>
    q === "" || g.people.some(p => p.name.toLowerCase().includes(q))
  );

  if(filtered.length === 0){
    grid.innerHTML = '<div class="empty">No matches found — try another name.</div>';
    return;
  }

  grid.innerHTML = filtered.map(g => `
    <div class="group">
      <div class="connector">${g.people.length} lookalikes</div>
      <div class="tiles">
        ${g.people.map((p, i) => tileHTML(p, i)).join("")}
      </div>
    </div>
  `).join("");
}

document.getElementById("search").addEventListener("input", (e) => {
  render(e.target.value);
});

fetch("data.json")
  .then(res => {
    if(!res.ok) throw new Error("Failed to load data.json");
    return res.json();
  })
  .then(data => {
    groups = data.groups || [];
    render("");
  })
  .catch(err => {
    document.getElementById("grid").innerHTML =
      '<div class="empty">Could not load data.json. If you opened this file directly (file://), host it via GitHub Pages or a local server instead.</div>';
    console.error(err);
  });
</script>

</body>
</html>
